name: Deploy Kong

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Diagnose token (temporary)
        continue-on-error: true
        run: |
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          echo "--- verify"; curl -s -H "$H" https://api.cloudflare.com/client/v4/user/tokens/verify | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("success"), (d.get("result") or {}).get("status"), d.get("errors"))'
          echo "--- accounts visible"; curl -s -H "$H" https://api.cloudflare.com/client/v4/accounts | python3 -c 'import sys,json; d=json.load(sys.stdin); print([(a["id"][:8],a["name"]) for a in d.get("result") or []], d.get("errors"))'
          echo "--- configured account id prefix: ${CLOUDFLARE_ACCOUNT_ID:0:8}"
          echo "--- d1 list"; curl -s -H "$H" https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("success"), d.get("errors"))'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply kong --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
